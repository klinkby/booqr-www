<a class="skip-link" href="#main-content">Spring til indhold</a>
<header class="site-header">
  <div class="bar">
    <a class="brand" href="{{ "/" | relLangURL }}"{{ if .IsHome }} aria-current="page"{{ end }}><img src="{{ "favicon.svg" | relURL }}" alt="" width="24" height="24"><span class="brand-name">booqr</span></a>
    <nav aria-label="Hovedmenu">
      <ul>
        {{- range site.Menus.main }}
        <li><a class="nav-link" href="{{ .URL }}"{{ if $.IsMenuCurrent "main" . }} aria-current="page"{{ end }}>{{ .Name }}</a></li>
        {{- end }}
        <li><a class="button small" href="{{ partial "mailto.html" . }}">Anmod om en invitation</a></li>
      </ul>
    </nav>
  </div>
</header>
