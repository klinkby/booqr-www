{{- define "main" }}
<article class="doc">
  <div class="shell">
    <header class="doc-head">
      <h1>{{ .Title }}</h1>
    </header>
    {{- with .Content }}
    <div class="prose">{{ . }}</div>
    {{- end }}
    <p class="back"><a href="{{ "/" | relLangURL }}">← Tilbage til forsiden</a></p>
  </div>
</article>
{{- end }}
