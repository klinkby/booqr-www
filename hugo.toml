baseURL = "https://www.booqr.dk/"
locale = "da-dk"
defaultContentLanguage = "da"
title = "booqr"

# We author every template ourselves under layouts/ — no external theme.
# No RSS/taxonomies are part of this one-page site, so they are switched off
# to keep the build output lean and warning-free.
disableKinds = ["RSS", "taxonomy", "term", "sitemap"]
enableRobotsTXT = true

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      # Raw/unsafe HTML in Markdown stays disabled — use shortcodes instead.
      unsafe = false
  [markup.tableOfContents]
    # The terms page lists its top-level sections only.
    startLevel = 2
    endLevel = 2
    ordered = false

[params]
  # Set to true to keep the site out of search results (noindex + robots
  # Disallow), e.g. while a rebuild is under way.
  noindex = false

[[menus.footer]]
  name = "Vilkår"
  pageRef = "/terms"
  weight = 10
[[menus.footer]]
  name = "Privatlivspolitik"
  pageRef = "/privacy"
  weight = 20
[[menus.footer]]
  name = "Databehandleraftale"
  pageRef = "/data-processing"
  weight = 30
